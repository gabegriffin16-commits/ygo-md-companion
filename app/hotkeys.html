<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Overlay Hotkeys</title>
<style>
:root{--bg:#1B1640;--panel:#262058;--panel2:#30296b;--ink:#F3F0FF;--muted:#B4ADDB;--gold:#E0B85E;--red:#D2606F;--line:#3d3580}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden}
.bar{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 14px;-webkit-app-region:drag;background:var(--panel);border-bottom:2px solid var(--gold)}
.bar b{font-weight:700;letter-spacing:.03em}
.bar button{-webkit-app-region:no-drag}
.wrap{height:calc(100% - 34px);overflow-y:auto;padding:14px 16px 18px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(224,184,94,.45);border-radius:9px}::-webkit-scrollbar-track{background:transparent}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.lab{font-weight:600}.lab small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.key{min-width:150px;text-align:center;font:600 12.5px Consolas,monospace;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.key.cap{border-color:var(--gold);color:var(--gold);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(224,184,94,.25)}}
button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:600 12.5px "Segoe UI",sans-serif;cursor:pointer}
button:hover{border-color:var(--gold)}
.x{background:none;border:0;font-size:16px;color:var(--muted);padding:4px 8px}
.msg{min-height:20px;font-size:12.5px;margin-top:8px}.msg.err{color:var(--red)}.msg.ok{color:var(--gold)}
.foot{display:flex;justify-content:space-between;margin-top:14px}
</style></head>
<body>
<div class="bar"><b>Overlay hotkeys</b><button class="x" id="close" title="Close">✕</button></div>
<div class="wrap">
  <p class="hint">Click <b>Change</b>, then press the new key combo. Use at least one of Ctrl, Alt, or Shift (F-keys work alone). Esc cancels. Changes save instantly.</p>
  <div id="list"></div>
  <div class="msg" id="msg"></div>
  <div class="foot"><button id="reset">Reset to defaults</button><button id="done">Done</button></div>
</div>
<script>
const LABELS = {
  toggle:["Show / hide overlay",""], clickThrough:["Click-through lock","Clicks pass to the game"],
  opacityUp:["Opacity up",""], opacityDown:["Opacity down",""], compact:["Compact / full view",""],
  next:["Next duel step","Draw → Main → End → next turn"], undo:["Undo last play",""],
  ash:["Mark Ash","On the current trigger or last play"], imp:["Mark Imperm",""], neg:["Mark other negate",""],
  find:["Card lookup",""], snapLeft:["Snap left","Again to jump to the monitor on the left"], snapRight:["Snap right","Again to jump to the monitor on the right"], expand:["Full view / compact","Fill the monitor, or back to the side column"]
};
const CODE = {Space:"Space",Tab:"Tab",Enter:"Enter",Backspace:"Backspace",Delete:"Delete",Insert:"Insert",Home:"Home",End:"End",PageUp:"PageUp",PageDown:"PageDown",
  ArrowUp:"Up",ArrowDown:"Down",ArrowLeft:"Left",ArrowRight:"Right",Minus:"-",Equal:"=",BracketLeft:"[",BracketRight:"]",Backslash:"\\",Semicolon:";",Quote:"'",
  Comma:",",Period:".",Slash:"/",Backquote:"`",NumpadAdd:"numadd",NumpadSubtract:"numsub",NumpadMultiply:"nummult",NumpadDivide:"numdiv",NumpadDecimal:"numdec"};
function keyName(e){
  const c = e.code;
  if (/^Key[A-Z]$/.test(c)) return c.slice(3);
  if (/^Digit\d$/.test(c)) return c.slice(5);
  if (/^Numpad\d$/.test(c)) return "num" + c.slice(6);
  if (/^F\d{1,2}$/.test(c)) return c;
  return CODE[c] || null;
}
function pretty(a){ return (a || "—").replace(/Control/g,"Ctrl").replace(/\+/g," + ").replace("Super","Win"); }
let hk = {}, capturing = null;
const list = document.getElementById("list"), msg = document.getElementById("msg");
function say(t, cls){ msg.textContent = t; msg.className = "msg " + (cls || ""); }
function render(){
  list.innerHTML = "";
  Object.keys(LABELS).forEach(a => {
    const r = document.createElement("div"); r.className = "row";
    const l = document.createElement("div"); l.className = "lab"; l.innerHTML = LABELS[a][0] + (LABELS[a][1] ? "<small>" + LABELS[a][1] + "</small>" : "");
    const k = document.createElement("div"); k.className = "key" + (capturing === a ? " cap" : ""); k.textContent = capturing === a ? "Press keys…" : pretty(hk[a]);
    const b = document.createElement("button"); b.textContent = capturing === a ? "Cancel" : "Change";
    b.onclick = () => { capturing = capturing === a ? null : a; window.overlayApp.capturing(!!capturing); say(capturing ? "Listening… press the combo for " + LABELS[a][0] + "." : ""); render(); };
    r.append(l, k, b); list.appendChild(r);
  });
}
document.addEventListener("keydown", async e => {
  if (!capturing) return;
  e.preventDefault();
  if (e.key === "Escape"){ capturing = null; window.overlayApp.capturing(false); say(""); render(); return; }
  const k = keyName(e); if (!k) return; // waiting for a non-modifier key
  const mods = []; if (e.ctrlKey) mods.push("Control"); if (e.altKey) mods.push("Alt"); if (e.shiftKey) mods.push("Shift"); if (e.metaKey) mods.push("Super");
  if (!mods.length && !/^F\d/.test(k)){ say("Add Ctrl, Alt, or Shift so it doesn't fire while you type or play.", "err"); return; }
  const accel = mods.concat([k]).join("+"), action = capturing;
  capturing = null; window.overlayApp.capturing(false);
  const res = await window.overlayApp.setHotkey(action, accel);
  if (res.ok){ hk = res.hotkeys; say(LABELS[action][0] + " is now " + pretty(accel) + ".", "ok"); }
  else say(res.msg, "err");
  render();
});
document.getElementById("reset").onclick = async () => { hk = await window.overlayApp.resetHotkeys(); say("Back to the defaults.", "ok"); render(); };
document.getElementById("done").onclick = document.getElementById("close").onclick = () => window.overlayApp.closeMe();
window.overlayApp.getHotkeys().then(h => { hk = h; render(); });
</script>
</body></html>
