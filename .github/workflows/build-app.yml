# Builds the Windows app whenever anything in app/ changes and posts it as a GitHub release.
# The release tag comes from "version" in app/package.json, so bump that to ship a new build.
# The app checks the latest release on start and offers an Update button.
name: Build app

on:
  push:
    branches: [main]
    paths: ["app/**", "combo-engine/**", ".github/workflows/build-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so two quick pushes can't both try to publish the same version.
concurrency:
  group: build-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./app/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists. Bump the version in app/package.json to publish a new build."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      # The combo finder helper (combo-engine/, AGPL). Built on every run so a change to it is checked even
      # without a version bump; only a bumped version ships it.
      - name: Fetch combo engine sources
        shell: bash
        run: |
          set -e
          mkdir -p ce-src ce-deps/miniz ce-deps/sqlite
          git clone --quiet https://github.com/edo9300/ygopro-core ce-src/ygopro-core
          git -C ce-src/ygopro-core checkout --quiet 38d04c9feb1a26617407091380634c87262fe3f8
          git -C ce-src/ygopro-core submodule update --init --quiet
          git clone --quiet --depth 1 --branch v2.1.7 https://github.com/microsoft/mimalloc ce-src/mimalloc
          curl -fsSL -o ce-deps/json.hpp https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp
          curl -fsSL -o miniz.zip https://github.com/richgel999/miniz/releases/download/3.0.2/miniz-3.0.2.zip
          unzip -q -o miniz.zip -d ce-deps/miniz
          curl -fsSL -o sqlite.zip https://www.sqlite.org/2024/sqlite-amalgamation-3460100.zip
          unzip -q -j -o sqlite.zip '*/sqlite3.c' '*/sqlite3.h' -d ce-deps/sqlite

      - name: Build combo engine
        shell: bash
        run: |
          set -e
          cmake -S combo-engine -B ce-build -A x64 -DOCGCORE_DIR="$(cygpath -m "$PWD/ce-src/ygopro-core")" -DDEPS_DIR="$(cygpath -m "$PWD/ce-deps")" -DMIMALLOC_DIR="$(cygpath -m "$PWD/ce-src/mimalloc")"
          cmake --build ce-build --config Release --parallel
          mkdir -p app/engine
          cp ce-build/Release/combo-engine.exe app/engine/
          cp combo-engine/LICENSE app/engine/LICENSE.txt
          cp combo-engine/README.md app/engine/README.md
          ./app/engine/combo-engine.exe --version

      # Same downloads the app makes on first use, then a short search with a known HERO hand.
      - name: Smoke test combo engine
        shell: bash
        run: |
          set -e
          curl -fsSL -o ce-scripts.zip https://codeload.github.com/ProjectIgnis/CardScripts/zip/refs/heads/master
          curl -fsSL -o ce-cards.cdb https://raw.githubusercontent.com/ProjectIgnis/BabelCDB/master/cards.cdb
          DECK='[40044918,18094166,18094166,18094166,27780618,22865492,9411399,9411399,50720316,50720316,59392529,59392529,13093792,89943723,14124483,64184058,16605586,213326,213326,8949584,24094653,24094653,52947044,52947044,52947044,21143940,14558127,14558127,14558127,10045474,10045474,10045474,23434538,23434538,23434538,97268402,97268402,97268402,24224830,24224830]'
          EXTRA='[22908820,60461804,60461804,30757127,90579153,40854197,3642509,33574806,45170821,46759931,58481572,1948619,58004362,63813056,19324993]'
          ( echo '{"id":1,"cmd":"init","cdb":"ce-cards.cdb","scripts":"ce-scripts.zip"}'
            echo "{\"id\":2,\"cmd\":\"search\",\"deck\":$DECK,\"extra\":$EXTRA,\"hand\":[40044918,18094166],\"timeMs\":5000,\"threads\":2,\"top\":3}"
            sleep 9; echo '{"cmd":"quit"}' ) | ./app/engine/combo-engine.exe > ce-out.txt
          head -c 1500 ce-out.txt; echo
          grep -q '"ready":true' ce-out.txt
          grep '"done":true' ce-out.txt | grep -q '"steps":\[{'

      - uses: actions/setup-node@v4
        if: steps.v.outputs.skip != '1'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Bundle the offline copy of the site
        if: steps.v.outputs.skip != '1'
        shell: bash
        run: mkdir -p app/site && cp index.html deck.json rules.json cards.json app/site/

      - name: Install
        if: steps.v.outputs.skip != '1'
        working-directory: app
        run: npm ci

      - name: Build exe
        if: steps.v.outputs.skip != '1'
        working-directory: app
        run: npx electron-builder --win portable --publish never

      - name: Publish release
        if: steps.v.outputs.skip != '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          git log -1 --pretty=%B | sed '/^Co-Authored-By/d;/^Claude-Session/d' > notes.txt
          gh release create "v$V" app/dist/MasterDuelCompanion.exe --title "Master Duel Companion App v$V" --notes-file notes.txt
